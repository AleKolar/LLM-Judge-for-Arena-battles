<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Arena 🧠⚖️</title>
<link rel="icon" href="static/favicon.ico">
<style>
body {
    font-family: Arial;
    max-width: 1200px;
    margin: auto;
    background: #f5f7fb;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    margin: 15px 0;
    border-radius: 10px;
}

.arena {
    display: flex;
    gap: 10px;
}

.box {
    flex: 1;
    background: #111;
    color: #0f0;
    padding: 10px;
    min-height: 200px;
    white-space: pre-wrap;
    border-radius: 8px;
}

button {
    padding: 10px 15px;
    margin: 5px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.winner {
    background: #222;
    color: white;
    padding: 15px;
    border-radius: 8px;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="card">
    <h2>🧠 LLM Arena</h2>

    <select id="model1"></select>
    ⚔️
    <select id="model2"></select>

    <br><br>

    <button onclick="runArena()">⚡ Сгенерировать код</button>

    <button id="judgeBtn" onclick="judgeArena()" disabled>
        👑 Решение судьи
    </button>
</div>

<div class="card arena">
    <div class="box" id="code1">Model A output...</div>
    <div class="box" id="code2">Model B output...</div>
</div>

<div class="card">
    <div id="winner"></div>
</div>

<script>

    let arenaState = "idle";
    let lastArenaResults = [];

    const MODELS = {
        "gpt-4o-mini": "GPT-4o-mini",
        "deepseek-chat": "DeepSeek",
        "llama-3.1-8b": "Llama 3.1",
        "qwen3-coder-480b": "Qwen 480B",
        "llama-3.3-70b": "Llama 70B"
    };

    // загрузка моделей
    window.onload = () => {
        const m1 = document.getElementById("model1");
        const m2 = document.getElementById("model2");

        for (let m in MODELS) {
            m1.innerHTML += `<option value="${m}">${MODELS[m]}</option>`;
            m2.innerHTML += `<option value="${m}">${MODELS[m]}</option>`;
        }
    };

    // 1️⃣ GENERATE
    async function runArena() {

        arenaState = "generating";
        document.getElementById("judgeBtn").disabled = true;

        document.getElementById("code1").innerText = "Generating...";
        document.getElementById("code2").innerText = "Generating...";
        document.getElementById("winner").innerHTML = "";

        const m1 = document.getElementById("model1").value;
        const m2 = document.getElementById("model2").value;

        const resp = await fetch("/api/llm-arena/compare", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({models: [m1, m2]})
        });

        const data = await resp.json();

        const r = data.results || [];

        document.getElementById("code1").innerText =
            r[0]?.content || "error";

        document.getElementById("code2").innerText =
            r[1]?.content || "error";

        lastArenaResults = r;

        arenaState = "generated";

        // включаем судью
        document.getElementById("judgeBtn").disabled = false;
    }

    // 2️⃣ JUDGE
    async function judgeArena() {

        if (arenaState !== "generated") {
            alert("Сначала сгенерируйте код");
            return;
        }

        const resp = await fetch("/api/llm-arena/winner", {
            method: "POST"
        });

        const data = await resp.json();

        const winner = data.winners?.[0] || "DRAW";

        const judgeReason =
            data.reason ||
            data.judge_result?.reason ||
            "Judge explanation unavailable";

        document.getElementById("winner").innerHTML = `
    <div class="winner">
        ⚖️ JUDGE RESULT<br><br>

        🏆 Winner:
        <b>${winner}</b><br><br>

        📌 <b>Judge reasoning:</b><br>
        ${judgeReason}
    </div>
`;

        arenaState = "judged";
        document.getElementById("judgeBtn").disabled = true;
    }

</script>

</body>
</html>
