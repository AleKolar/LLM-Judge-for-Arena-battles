<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Arena 🧠⚖️</title>
    <link rel="icon" href="static/favicon.ico">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: #f0f4f8;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin: 20px 0;
        }

        h2 {
            color: #2d3748;
            font-size: 1.8em;
            margin-bottom: 15px;
        }

        select {
            padding: 10px;
            font-size: 1em;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            margin-right: 10px;
            background: white;
        }

        button {
            padding: 12px 24px;
            font-size: 1em;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            transition: background 0.2s;
        }

        button:hover {
            background: #5a67d8;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #a0aec0;
        }

        .arena {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .box {
            flex: 1;
            position: relative;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 0;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            min-height: 220px;
            font-size: 0.9em;
            overflow: hidden;
        }

        .model-label {
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(255, 255, 255, 0.12);
            color: #d4d4d4;
            padding: 3px 10px;
            font-size: 12px;
            font-weight: bold;
            border-bottom-right-radius: 8px;
            z-index: 2;
            pointer-events: none;
            letter-spacing: 0.5px;
        }

        .code-content {
            margin: 28px 10px 10px 10px;
            padding: 8px;
            background: transparent;
            overflow-x: auto;
        }

        .winner {
            background: #2d3748;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 1.05em;
            line-height: 1.5;
        }

        .winner b {
            color: #c6f6d5;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>🧠 LLM Arena</h2>

    <select id="model1"></select>
    ⚔️
    <select id="model2"></select>

    <br><br>

    <button onclick="runArena()">⚡ Сгенерировать код</button>
    <button id="judgeBtn" onclick="judgeArena()" disabled>👑 Решение судьи</button>
    <button id="downloadBtn" onclick="downloadResult()" disabled style="display:none;">📥 Скачать результат</button>
</div>

<div class="card arena">
    <div class="box" id="code1">
        <span class="model-label">Модель A</span>
        <pre class="code-content" id="code1-text">Model A output...</pre>
    </div>
    <div class="box" id="code2">
        <span class="model-label">Модель B</span>
        <pre class="code-content" id="code2-text">Model B output...</pre>
    </div>
</div>

<div class="card">
    <div id="winner"></div>
</div>

<script>
    let arenaState = "idle";
    let currentBattleId = null;

    const MODELS = {
        "gpt-4o-mini": "GPT-4o-mini",
        "deepseek-chat": "DeepSeek",
        "llama-3.1-8b": "Llama 3.1",
        "qwen3-coder-480b": "Qwen 480B",
        "llama-3.3-70b": "Llama 70B"
    };

    // Обратный маппинг: короткое имя -> полный идентификатор (из AVAILABLE_MODELS)
    const MODEL_IDS = {
        "gpt-4o-mini": "openai/gpt-4o-mini",
        "deepseek-chat": "deepseek/deepseek-chat",
        "llama-3.1-8b": "meta-llama/llama-3.1-8b-instruct",
        "qwen3-coder-480b": "qwen/qwen3-coder-480b-a35b-instruct:free",
        "llama-3.3-70b": "meta-llama/llama-3.3-70b-instruct:free"
    };

    window.onload = () => {
        const m1 = document.getElementById("model1");
        const m2 = document.getElementById("model2");
        for (let m in MODELS) {
            m1.innerHTML += `<option value="${m}">${MODELS[m]}</option>`;
            m2.innerHTML += `<option value="${m}">${MODELS[m]}</option>`;
        }
    };

    async function runArena() {
        arenaState = "generating";
        document.getElementById("judgeBtn").disabled = true;
        const downloadBtn = document.getElementById("downloadBtn");
        downloadBtn.style.display = "none";
        downloadBtn.disabled = true;

        document.getElementById("code1-text").innerText = "Generating...";
        document.getElementById("code2-text").innerText = "Generating...";
        document.getElementById("winner").innerHTML = "";

        const m1 = document.getElementById("model1").value;
        const m2 = document.getElementById("model2").value;

        const resp = await fetch("/api/llm-arena/compare", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({models: [m1, m2]})
        });

        const data = await resp.json();
        currentBattleId = data.arena_result_id;

        const r = data.results || [];
        document.getElementById("code1-text").innerText = r[0]?.content || "error";
        document.getElementById("code2-text").innerText = r[1]?.content || "error";

        arenaState = "generated";
        document.getElementById("judgeBtn").disabled = false;
    }

    async function judgeArena() {
        if (arenaState !== "generated" || !currentBattleId) {
            alert("Сначала сгенерируйте код");
            return;
        }

        const resp = await fetch(`/api/llm-arena/winner/${currentBattleId}`, {
            method: "POST"
        });
        const data = await resp.json();

        const winnerFull = data.winners?.[0] || null;
        const modelAShort = data.model_a_name || "Модель A";
        const modelBShort = data.model_b_name || "Модель B";
        const judgeWinner = data.judge_result?.winner; // "MODEL_A"/"MODEL_B"

        let winnerDisplay = "Ничья";

        if (winnerFull) {
            const fullA = MODEL_IDS[modelAShort];
            const fullB = MODEL_IDS[modelBShort];
            const isModelA = (winnerFull === fullA);
            const isModelB = (winnerFull === fullB);

            let shortName = winnerFull;
            if (isModelA) shortName = modelAShort;
            else if (isModelB) shortName = modelBShort;

            let label = "";
            if (judgeWinner) {
                label = judgeWinner === "MODEL_A" ? "(Модель A)" : "(Модель B)";
            } else {
                label = isModelA ? "(Модель A)" : "(Модель B)";
            }

            winnerDisplay = `${shortName} <b>${label}</b>`;
        }

        const judgeReason = data.reason || data.judge_result?.reason || "Комментарий отсутствует";

        document.getElementById("winner").innerHTML = `
            <div class="winner">
                ⚖️ Результат битвы<br><br>
                🏆 Победитель: ${winnerDisplay}<br><br>
                📌 Комментарии к результату:<br>
                ${judgeReason}
            </div>
        `;

        arenaState = "judged";
        document.getElementById("judgeBtn").disabled = true;
        const downloadBtn = document.getElementById("downloadBtn");
        downloadBtn.style.display = "inline-block";
        downloadBtn.disabled = false;
    }

    function downloadResult() {
        if (!currentBattleId) return;
        const link = document.createElement("a");
        link.href = `/api/llm-arena/download-result/${currentBattleId}`;
        link.download = `battle_${currentBattleId}_result.md`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
</body>
</html>
