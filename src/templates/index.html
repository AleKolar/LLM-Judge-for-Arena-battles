<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Arena 🧠⚖️</title>
    <link rel="icon" href="static/favicon.ico">
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 1200px; margin: 40px auto; padding: 20px; background: #f0f4f8; }
        .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,.1); margin: 20px 0; }
        h2 { color: #2d3748; font-size: 1.8em; margin-bottom: 15px; }
        select { padding: 10px; font-size: 1em; border: 2px solid #cbd5e0; border-radius: 8px; margin-right: 10px; background: white; }
        button { padding: 12px 24px; font-size: 1em; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 5px; transition: background .2s; }
        button:hover { background: #5a67d8; }
        button:disabled { opacity: .5; cursor: not-allowed; background: #a0aec0; }
        .arena { display: flex; gap: 20px; margin-top: 10px; }
        .box { flex: 1; position: relative; background: #1e1e1e; color: #d4d4d4; padding: 0; border-radius: 8px; font-family: monospace; white-space: pre-wrap; min-height: 220px; font-size: .9em; }
        .model-label { position: absolute; top: 0; left: 0; background: rgba(255,255,255,.12); color: #d4d4d4; padding: 3px 10px; font-size: 12px; font-weight: bold; border-bottom-right-radius: 8px; }
        .code-content { margin: 28px 10px 10px; padding: 8px; background: transparent; overflow-x: auto; }
        .winner { background: #2d3748; color: white; padding: 20px; border-radius: 8px; margin-top: 15px; font-size: 1.05em; line-height: 1.5; }
        .winner b { color: #c6f6d5; }
        @media (max-width: 700px) { .arena { flex-direction: column; } }
    </style>
</head>
<body>
<div class="card">
    <h2>🧠 LLM Arena</h2>
    <select id="model1"></select> ⚔️ <select id="model2"></select>
    <br><br>
    <label for="judgeModel">Судья:</label>
    <select id="judgeModel"></select>
    <br><br>
    <button onclick="runArena()">⚡ Сгенерировать код</button>
    <button id="judgeBtn" onclick="judgeArena()" disabled>👑 Решение судьи</button>
    <button id="downloadBtn" onclick="downloadResult()" disabled style="display:none;">📥 Скачать результат</button>
</div>
<div class="card arena">
    <div class="box"><span class="model-label">Модель A</span><pre class="code-content" id="code1-text">Model A output...</pre></div>
    <div class="box"><span class="model-label">Модель B</span><pre class="code-content" id="code2-text">Model B output...</pre></div>
</div>
<div class="card"><div id="winner"></div></div>
<script>
    let arenaState = "idle";
    let currentBattleId = null;

    // ── Модели. По умолчанию — fallback, перезапишется с бэкенда при загрузке страницы ──
    // Формат: { "model-key": { display_name: "..." , ... }, ... }
    let MODELS = {
        "llama-3.1-8b":  { display_name: "🦙 Llama 3.1 8B" },
        "qwen-coder-7b": { display_name: "🐍 Qwen Coder 7B" },
        "qwen3-4b":      { display_name: "🌱 Qwen3 4B" },
        "gemma-3-4b":    { display_name: "💎 Gemma 3 4B" },
        "qwen3-14b":     { display_name: "🌊 Qwen3 14B" },
        "gpt-oss-20b":   { display_name: "🤖 gpt-oss 20B" },
        "phi-4":         { display_name: "🧪 Phi-4" },
    };
    let JUDGE_MODELS = {
        "gpt-oss-120b":  { display_name: "⚖️ gpt-oss 120B (Judge)" },
        "llama-3.3-70b": { display_name: "⚖️ Llama 3.3 70B (Judge)" },
        "qwen3-32b":     { display_name: "⚖️ Qwen3 32B (Judge)" },
    };

    const DEFAULT_MODEL_A = "llama-3.1-8b";
    const DEFAULT_MODEL_B = "qwen-coder-7b";
    const DEFAULT_JUDGE   = "gpt-oss-120b";

    // ── Утилиты для отображения имён ──
    function modelLabel(id) {
        return (MODELS[id] && MODELS[id].display_name) || id;
    }
    function judgeLabel(id) {
        return (JUDGE_MODELS[id] && JUDGE_MODELS[id].display_name) || id;
    }

    // ── Загрузка актуального списка моделей с бэкенда ──
    async function loadModelsFromBackend() {
        try {
            const [modelsResp, judgesResp] = await Promise.all([
                fetch("/api/llm-arena/models"),
                fetch("/api/llm-arena/judge_models"),
            ]);
            if (modelsResp.ok) {
                const data = await modelsResp.json();
                if (data && typeof data === "object" && Object.keys(data).length) {
                    MODELS = data;
                }
            }
            if (judgesResp.ok) {
                const data = await judgesResp.json();
                if (data && typeof data === "object" && Object.keys(data).length) {
                    JUDGE_MODELS = data;
                }
            }
        } catch (e) {
            console.warn("Не удалось загрузить список моделей с бэкенда, использую fallback:", e);
        }
    }

    // ── Заполнение <select> актуальными моделями ──
    function fillSelects() {
        const m1 = document.getElementById("model1");
        const m2 = document.getElementById("model2");
        const judge = document.getElementById("judgeModel");

        m1.innerHTML = "";
        m2.innerHTML = "";
        judge.innerHTML = "";

        const modelIds = Object.keys(MODELS);
        for (const id of modelIds) {
            const label = modelLabel(id);
            m1.add(new Option(label, id));
            m2.add(new Option(label, id));
        }

        // Выбор дефолтов: если есть в списке — ставим, иначе первый / второй доступный
        m1.value = modelIds.includes(DEFAULT_MODEL_A) ? DEFAULT_MODEL_A : (modelIds[0] || "");
        m2.value = modelIds.includes(DEFAULT_MODEL_B) ? DEFAULT_MODEL_B : (modelIds[1] || modelIds[0] || "");

        const judgeIds = Object.keys(JUDGE_MODELS);
        for (const id of judgeIds) {
            judge.add(new Option(judgeLabel(id), id));
        }
        judge.value = judgeIds.includes(DEFAULT_JUDGE) ? DEFAULT_JUDGE : (judgeIds[0] || "");
    }

    window.onload = async () => {
        await loadModelsFromBackend();
        fillSelects();
    };

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.appendChild(document.createTextNode(String(text ?? '')));
        return div.innerHTML;
    }

    async function runArena() {
        arenaState = "generating";
        document.getElementById("judgeBtn").disabled = true;
        const downloadBtn = document.getElementById("downloadBtn");
        downloadBtn.style.display = "none";
        downloadBtn.disabled = true;
        document.getElementById("code1-text").innerText = "Generating...";
        document.getElementById("code2-text").innerText = "Generating...";
        document.getElementById("winner").innerHTML = "";

        try {
            const resp = await fetch("/api/llm-arena/compare", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    models: [
                        document.getElementById("model1").value,
                        document.getElementById("model2").value,
                    ],
                }),
            });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.detail || "Ошибка генерации");

            currentBattleId = data.arena_result_id;
            const results = data.results || [];
            document.getElementById("code1-text").innerText = results[0]?.content || "Ошибка: пустой ответ";
            document.getElementById("code2-text").innerText = results[1]?.content || "Ошибка: пустой ответ";

            arenaState = "generated";
            document.getElementById("judgeBtn").disabled = false;
        } catch (error) {
            arenaState = "idle";
            document.getElementById("code1-text").innerText = `Ошибка: ${error.message}`;
            document.getElementById("code2-text").innerText = "Генерация не выполнена";
        }
    }

    async function judgeArena() {
        if (arenaState !== "generated" || !currentBattleId) {
            return alert("Сначала сгенерируйте код");
        }
        const judgeModel = document.getElementById("judgeModel").value;

        try {
            const resp = await fetch(`/api/llm-arena/winner/${currentBattleId}`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({judge_model: judgeModel}),
            });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.detail || "Ошибка судейства");

            const winnerFull = data.winners?.[0] || null;
            const modelA = data.model_a_name || document.getElementById("model1").value;
            const modelB = data.model_b_name || document.getElementById("model2").value;

            let winnerDisplay = "Ничья";
            if (winnerFull) {
                const positionName = data.winner_position === "MODEL_A" ? modelA : modelB;
                const positionLabel = data.winner_position === "MODEL_A" ? "Модель A" : "Модель B";
                winnerDisplay = `${modelLabel(positionName)} <b>(${positionLabel})</b>`;
            }

            const reason = data.judge_result?.reason || data.reason || "Комментарий отсутствует";
            document.getElementById("winner").innerHTML = `
                <div class="winner">
                    ⚖️ Результат битвы<br><br>
                    🏆 Победитель: ${winnerDisplay}<br>
                    🧑‍⚖️ Судья: ${judgeLabel(judgeModel)}<br>
                    💬 Причина: ${escapeHtml(reason)}
                </div>`;

            arenaState = "judged";
            document.getElementById("judgeBtn").disabled = true;
            document.getElementById("downloadBtn").style.display = "inline-block";
            document.getElementById("downloadBtn").disabled = false;
        } catch (error) {
            document.getElementById("winner").innerHTML =
                `<div class="winner">Ошибка судейства: ${escapeHtml(error.message)}</div>`;
        }
    }

    function downloadResult() {
        if (!currentBattleId) return;
        const link = document.createElement("a");
        link.href = `/api/llm-arena/download-result/${currentBattleId}`;
        link.download = `battle_${currentBattleId}_result.md`;
        document.body.appendChild(link);
        link.click();
        link.remove();
    }
</script>
</body>
</html>
